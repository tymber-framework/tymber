<% TITLE = `${CTX.app.name} - ${$t("tymber.log.logs")}`; %>

<nav class="breadcrumb" aria-label="breadcrumbs">
  <ul>
    <li>
      <a href="/admin" aria-current="page"><%= $t("tymber.common.home") %></a>
    </li>
    <li class="is-active">
      <a href="#" aria-current="page"><%= $t("tymber.log.logs") %></a>
    </li>
  </ul>
</nav>

<h1 class="title is-spaced"><%= $t("tymber.log.logs") %></h1>

<div id="app"></div>

<script type="module">
  import { createApp } from "vue";
  import {
    doFetch,
    DataTable,
    snakeToCamelCase,
    camelToSnakeCase,
  } from "./utils";

  const LogLevelTag = {
    props: {
      level: String,
    },

    computed: {
      color() {
        switch (this.level) {
          case "debug":
            return "is-info";
          case "info":
            return "is-primary";
          case "warn":
            return "is-warning";
          case "error":
            return "is-danger";
          default:
            return "";
        }
      },
    },

    template: `
      <span class="tag" :class="color">{{ level.toUpperCase() }}</span>
    `,
  };

  const LogsTable = {
    components: {
      DataTable,
      LogLevelTag,
    },

    data() {
      return {
        headers: [
          {
            text: "<%= $t('tymber.log.createdAt') %>",
            value: "createdAt",
            isSortable: true,
          },
          {
            text: "<%= $t('tymber.log.level') %>",
            value: "level",
            isSortable: false,
          },
          {
            text: "<%= $t('tymber.log.component') %>",
            value: "component",
            isSortable: false,
          },
          {
            text: "<%= $t('tymber.log.message') %>",
            value: "message",
            width: "70%",
          },
        ],
        isLoading: false,
        shouldRerun: false,
        items: [],
        options: {
          sortBy: "createdAt",
          sortDesc: true,
        },
        levels: ["debug", "info", "warn", "error"],
        level: "",
        component: "",
        components: [],
        fromDate: "",
        toDate: "",
      };
    },

    methods: {
      readQueryParams() {
        const query = new URLSearchParams(window.location.search);

        this.level = query.get("l") || "";
        this.component = query.get("c") || "";

        const fromParam = query.get("from");
        const toParam = query.get("to");

        // Convert ISO 8601 to datetime-local format (YYYY-MM-DDTHH:MM)
        this.fromDate = fromParam ? this.toDateTimeLocal(fromParam) : "";
        this.toDate = toParam ? this.toDateTimeLocal(toParam) : "";

        const sort = query.get("s");

        if (sort) {
          const parts = sort.split("|");
          const column = snakeToCamelCase(parts[0]);
          if (
            this.headers.some((h) => h.value === column) &&
            ["asc", "desc"].includes(parts[1])
          ) {
            this.options.sortBy = column;
            this.options.sortDesc = parts[1] === "desc";
          }
        }
      },

      updateQueryParams() {
        const query = new URLSearchParams();

        query.set(
          "s",
          `${camelToSnakeCase(this.options.sortBy)}|${this.options.sortDesc ? "desc" : "asc"}`,
        );

        if (this.level) {
          query.set("l", this.level);
        }

        if (this.component) {
          query.set("c", this.component);
        }

        if (this.fromDate) {
          query.set("from", this.toISO8601(this.fromDate));
        }

        if (this.toDate) {
          query.set("to", this.toISO8601(this.toDate));
        }

        window.history.replaceState(
          null,
          "",
          `${window.location.pathname}?${query}`,
        );
      },

      toISO8601(dateTimeLocal) {
        if (!dateTimeLocal) return "";
        return new Date(dateTimeLocal).toISOString();
      },

      toDateTimeLocal(isoString) {
        if (!isoString) return "";
        const date = new Date(isoString);
        const pad = (num) => num.toString().padStart(2, "0");
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
      },

      async loadItems() {
        if (this.isLoading) {
          this.shouldRerun = true;
          return;
        }
        this.isLoading = true;

        const query = {
          page: 1,
          size: 100,
          sort: `${camelToSnakeCase(this.options.sortBy)}:${this.options.sortDesc ? "desc" : "asc"}`,
        };

        if (this.level) {
          query.levels = [this.level];
        }

        if (this.component) {
          query.components = [this.component];
        }

        if (this.fromDate) {
          query.from = this.toISO8601(this.fromDate);
        }

        if (this.toDate) {
          query.to = this.toISO8601(this.toDate);
        }

        const res = await doFetch({
          path: "/api/admin/logs",
          query,
        });

        this.items = res.body?.items || [];
        this.isLoading = false;

        if (this.shouldRerun) {
          this.shouldRerun = false;
          return this.loadItems();
        }
      },

      async loadComponents() {
        const res = await doFetch({
          path: "/api/admin/logs/components",
        });

        this.components = res.body?.items || [];
      },

      onOptionsUpdate(options) {
        this.options.sortBy = options.sortBy;
        this.options.sortDesc = options.sortDesc;

        this.updateQueryParams();
        this.loadItems();
      },

      onLevelSelection(event) {
        this.level = event.target.value;
        this.updateQueryParams();
        this.loadItems();
      },

      onComponentSelection(event) {
        this.component = event.target.value;
        this.updateQueryParams();
        this.loadItems();
      },

      onFromDateChange(event) {
        this.fromDate = event.target.value;
        this.updateQueryParams();
        this.loadItems();
      },

      onToDateChange(event) {
        this.toDate = event.target.value;
        this.updateQueryParams();
        this.loadItems();
      },

      clearFilters() {
        this.level = "";
        this.component = "";
        this.fromDate = "";
        this.toDate = "";
        this.updateQueryParams();
        this.loadItems();
      },

      formatDate(dateString) {
        if (!dateString) return "-";
        const date = new Date(dateString);
        return date.toLocaleString();
      },
    },

    async created() {
      this.readQueryParams();
      await Promise.all([this.loadItems(), this.loadComponents()]);
    },

    template: `
        <div class="is-flex is-flex-wrap-wrap is-align-items-center mb-4">
          <div class="field mr-3">
            <label class="label"><%= $t("tymber.log.level") %></label>
            <div class="control">
              <div class="select is-fullwidth">
                <select :value="level" @change="onLevelSelection">
                  <option value=""><%= $t("tymber.log.allLevels") %></option>
                  <option v-for="level of levels" :value="level">{{ level.toUpperCase() }}</option>
                </select>
              </div>
            </div>
          </div>

          <div class="field mr-3">
            <label class="label"><%= $t("tymber.log.component") %></label>
            <div class="control">
              <div class="select is-fullwidth">
                <select :value="component" @change="onComponentSelection">
                  <option value=""><%= $t("tymber.log.allComponents") %></option>
                  <option v-for="comp in components" :value="comp">{{ comp }}</option>
                </select>
              </div>
            </div>
          </div>

          <div class="field mr-3">
            <label class="label"><%= $t("tymber.log.fromDate") %></label>
            <div class="control">
              <input
                type="datetime-local"
                class="input"
                :value="fromDate"
                @change="onFromDateChange"
              />
            </div>
          </div>

          <div class="field mr-3">
            <label class="label"><%= $t("tymber.log.toDate") %></label>
            <div class="control">
              <input
                type="datetime-local"
                class="input"
                :value="toDate"
                @change="onToDateChange"
              />
            </div>
          </div>

          <div class="field">
            <div class="control" style="margin-top: 20px">
              <button
                class="button is-text"
                @click="clearFilters"
              >
                <%= $t("tymber.log.clearFilters") %>
              </button>
            </div>
          </div>
        </div>

        <DataTable
          class="logs-datatable"
          :headers="headers"
          :value="items"
          :is-loading="isLoading"
          :options="options"
          @update:options="onOptionsUpdate"
        >
          <template #["item.createdAt"]="{ value }">
            {{ formatDate(value) }}
          </template>

          <template #["item.level"]="{ value }">
            <LogLevelTag :level="value" />
          </template>

          <template #["item.component"]="{ value }">
            {{ value || '-' }}
          </template>

          <template #["item.message"]="{ value }">
            <div>{{ value }}</div>
          </template>
        </DataTable>
    `,
  };

  createApp({
    components: {
      LogsTable,
    },

    template: `
      <LogsTable />
    `,
  }).mount("#app");
</script>

<style>
  .logs-datatable td:nth-child(4) {
    min-width: 60%
  }
</style>
